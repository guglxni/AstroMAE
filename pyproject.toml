[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astromae"
version = "0.2.0.dev0"
description = "Masked Autoencoders for astrophysical images."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AstroMAE contributors" }]
keywords = ["astronomy", "mae", "self-supervised", "vision-transformer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
  "astropy>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
tb = ["tensorboard>=2.14"]
astro = ["astroNN>=1.1"]
fits = ["astropy>=6.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "pre-commit>=3.5",
  "matplotlib>=3.7",
  "tensorboard>=2.14",
  "astropy>=6.0",
]

[project.urls]
Homepage = "https://github.com/guglxni/astromae"
Issues = "https://github.com/guglxni/astromae/issues"

[project.scripts]
astromae = "astromae.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["astromae*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
