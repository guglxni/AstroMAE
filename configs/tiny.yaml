# CPU-friendly tiny config for smoke tests and quick iteration.
dataset_dir: ./data/processed
image_size: 64
patch_size: 16
in_chans: 3

# Tiny ViT
embed_dim: 64
depth: 2
num_heads: 4
decoder_embed_dim: 32
decoder_depth: 1
decoder_num_heads: 4
mlp_ratio: 2.0

# Training
batch_size: 4
val_ratio: 0.2
epochs: 1
mask_ratio: 0.75
learning_rate: 1.0e-3
weight_decay: 0.05
warmup_epochs: 0
grad_clip: 1.0

# Runtime
checkpoint_dir: ./outputs/checkpoints
log_dir: ./outputs
save_every: 1
amp: false
tensorboard: false
log_interval: 1
seed: 42
