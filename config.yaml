# Default AstroMAE training config. See configs/ for alternatives
# (configs/default.yaml for GPU-scale runs, configs/tiny.yaml for CPU smoke).

dataset_dir: ./data/processed
image_size: 128
patch_size: 16
in_chans: 3

embed_dim: 768
depth: 12
num_heads: 12
decoder_embed_dim: 512
decoder_depth: 8
decoder_num_heads: 16
mlp_ratio: 4.0

batch_size: 8
val_ratio: 0.1
epochs: 10
mask_ratio: 0.75
learning_rate: 1.0e-4
weight_decay: 0.05
warmup_epochs: 1
grad_clip: 1.0

checkpoint_dir: ./outputs/checkpoints
log_dir: ./outputs
save_every: 5
amp: true
tensorboard: true
log_interval: 50
seed: 42
